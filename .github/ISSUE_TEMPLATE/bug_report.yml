name: Bug report
description: Report an installer, sync, packaging, or harness integration problem.
body:
  - type: markdown
    attributes:
      value: |
        Report vulnerabilities through [private vulnerability reporting](https://github.com/oDestroyeRo/skills/security/advisories/new). Remove credentials and private data from logs.
  - type: input
    id: revision
    attributes:
      label: Commit or plugin version
      description: Include the collection name when reporting a plugin issue.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your OS, harness and version, installation method, and relevant Python or Node.js version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command or skill invocation and a minimal example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and logs
    validations:
      required: true

name: Verify skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/skills.py check
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: node --test tests/opencode.test.mjs
      - run: python3 scripts/skills.py package --archive
      - uses: actions/upload-artifact@v4
        with:
          name: native-plugin-bundles
          path: dist/

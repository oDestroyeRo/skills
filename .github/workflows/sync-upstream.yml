name: Sync upstream skills

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-skills
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python3 scripts/skills.py sync
      - run: python3 scripts/skills.py check
      - run: python3 -m unittest discover -s tests -v
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: node --test tests/opencode.test.mjs tests/dsh.test.mjs
      - run: python3 scripts/skills.py package --archive
      - name: Commit changed snapshots and generated entry points
        shell: bash
        run: |
          git add --force sources.lock.json plugins distribution.lock.json package.json .agents/plugins/marketplace.json .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync upstream skills'
          git push
      - name: Publish versioned plugin bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("distribution.lock.json"))["package_version"])')
          tag="v$version"
          if ! release=$(gh release view "$tag" --json isDraft,assets); then
            gh release create "$tag" --draft --target "$(git rev-parse HEAD)" \
              --title "Skills $version" --generate-notes
            release=$(gh release view "$tag" --json isDraft,assets)
          fi
          missing=()
          for archive in dist/*-"$version".zip dist/*-"$version".tar.gz; do
            test -f "$archive"
            if ! jq -e --arg name "${archive##*/}" '.assets | any(.name == $name)' <<< "$release" >/dev/null; then
              missing+=("$archive")
            fi
          done
          if jq -e '.isDraft' <<< "$release" >/dev/null; then
            if (( ${#missing[@]} )); then
              gh release upload "$tag" "${missing[@]}"
            fi
            gh release edit "$tag" --draft=false
          elif (( ${#missing[@]} )); then
            printf 'Published release %s is missing expected archives.\n' "$tag" >&2
            exit 1
          fi

name: Sync upstream skills

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python3 scripts/skills.py sync
      - run: python3 scripts/skills.py check
      - run: python3 -m unittest discover -s tests -v
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: node --test tests/opencode.test.mjs
      - name: Commit changed snapshots and generated entry points
        shell: bash
        run: |
          git add --force upstream sources.lock.json plugins distribution.lock.json package.json .agents/plugins/marketplace.json .claude-plugin/marketplace.json .cursor-plugin/marketplace.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync upstream skills'
          git push
